# S39: gitleaks configuration. Extends the default rules; allows only the reviewed non-secrets below.
title = "Tarragon Health gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "reviewed non-secrets"
paths = [
  '''pnpm-lock\.yaml$''',
]
regexes = [
  '''sk_test_[A-Za-z0-9_.]*YOURS_HERE''',
  # S33 breathing screen: ACK_KEY is the name of an on-device storage slot ("breathing.safety_ack.v1"), not a credential.
  '''breathing\.safety_ack\.v1''',
]

# The Supabase anon key in apps/mobile/eas.json is public by design (row-level security is the protection). Allowed for the JWT rules in
# that one file only; anything else added to the file is still scanned by every other rule.
[[allowlists]]
description = "public anon key"
targetRules = ["jwt", "generic-api-key"]
paths = ['''apps/mobile/eas\.json$''']

# The generic-api-key rule fires on any constant or object property whose name ends in "key" next to a string, such as `const CACHE_KEY = "medicine-catalogue-v1"`,
# a registry entry `key: "outcomes.snapshot_rules"` or a test lookup `c.key === "..."`. In mobile source, test files and the proposed-config
# registry those are storage slot names and configuration names, not credentials (history is scanned too, so they cannot be reworded away).
# Only the generic rule is relaxed, and only for these paths: every specific rule (cloud keys, JWTs, private keys, payment keys) still applies there.
# Approved by the founder on 2026-10-07.
# gitleaks 8.21 does not read `targetRules` inside `[[allowlists]]`, so the relaxation is attached to the one rule it is for: this entry overrides only
# the allowlist of the built-in generic-api-key rule (every other field is inherited from the default rule).
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "storage slot and configuration names, not credentials"
paths = [
  '''apps/mobile/src/.*\.(ts|tsx)$''',
  '''.*\.test\.(ts|tsx)$''',
  '''packages/shared/src/proposed-config/registry\.ts$''',
  # Zoom webhook fixtures: payloads copied from Zoom's published documentation (placeholder plainToken / customer_key values, not credentials).
  # They live in history on build/provider-layer-completion, which CI scans, so they cannot be reworded away. Generic rule only.
  '''packages/integrations/src/fixtures/zoom/.*\.json$''',
]

# S88 crash-reporting scrubber tests: fake tokens that exist in history on s88/crash-reporting-sentry-lab-guard (commits 0eef9c740 and 9e3d0e356,
# which CI scans, so they cannot be reworded away without force-pushing an open PR). They are the public jwt.io sample header/payload with a
# made-up signature and a made-up sk_live_ lookalike, fed to the PHI/secret scrubber to prove it redacts them. Neither is a credential.
# The tip of the branch now builds both at runtime, so no new literal is committed. Each entry is limited to one rule, the two test files,
# and the exact fake value (condition = "AND": path AND secret must both match); any other jwt or stripe-access-token hit anywhere is still reported.
[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "S88 scrubber test fixture: public jwt.io sample token with a fake signature"
condition = "AND"
paths = [
  '''supabase/functions/_shared/observability/sentry\.test\.ts$''',
  '''apps/mobile/src/lib/crash-report\.test\.ts$''',
]
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghijk''']

[[rules]]
id = "stripe-access-token"
[[rules.allowlists]]
description = "S88 scrubber test fixture: made-up sk_live_ lookalike"
condition = "AND"
paths = ['''apps/mobile/src/lib/crash-report\.test\.ts$''']
regexes = ['''sk_live_51HxyzABCDEFGHIJ''']
