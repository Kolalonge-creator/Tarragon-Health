# S39: gitleaks configuration. Extends the default rules; allows only the reviewed non-secrets below.
title = "Tarragon Health gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "reviewed non-secrets"
paths = [
  '''pnpm-lock\.yaml$''',
]
regexes = [
  '''sk_test_[A-Za-z0-9_.]*YOURS_HERE''',
  # S33 breathing screen: ACK_KEY is the name of an on-device storage slot ("breathing.safety_ack.v1"), not a credential.
  '''breathing\.safety_ack\.v1''',
]

# The Supabase anon key in apps/mobile/eas.json is public by design (row-level security is the protection). Allowed for the JWT rules in
# that one file only; anything else added to the file is still scanned by every other rule.
[[allowlists]]
description = "public anon key"
targetRules = ["jwt", "generic-api-key"]
paths = ['''apps/mobile/eas\.json$''']

# On-device storage and cache slot names in the mobile app, for example `const CACHE_KEY = "medicine-catalogue-v1"`. The generic-api-key rule
# fires on any constant whose name ends in KEY next to a string; these are names of local storage slots, not credentials. Narrow on purpose:
# only the generic rule, only mobile source files, and only a `const NAME_WITH_KEY = "plain.slot-name"` line.
[[allowlists]]
description = "mobile storage slot names"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''apps/mobile/src/.*\.(ts|tsx)$''']
regexTarget = "line"
regexes = ['''const [A-Z][A-Z0-9_]*KEY[A-Z0-9_]*(: string)? = ["'][A-Za-z0-9._:/-]+["'];?\s*$''']
