packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 removed `onlyBuiltDependencies`; approved build scripts now live in the
# `allowBuilds` map (name -> boolean). sharp powers Next.js image optimisation,
# unrs-resolver is a native resolver used by the ESLint/oxc toolchain, and
# @sentry/cli downloads the prebuilt Sentry CLI binary used for source-map
# upload during build (apps/web/next.config.ts's withSentryConfig).
allowBuilds:
  '@sentry/cli': true
  # Optional native DTrace-probe addon pulled in transitively by bunyan (a
  # logging dep of eas-cli, added below for local `eas` builds). bunyan
  # requires it in a try/catch and no-ops if it's missing, so skipping the
  # native build is safe rather than compiling a probe library nothing here
  # uses.
  dtrace-provider: false
  # esbuild arrives via tsx, which runs the manual lab-corpus accuracy script.
  # Its postinstall only relinks the platform binary that tsx already ships as
  # an optional dependency, and the script was verified working with this build
  # skipped — so there is no reason to approve another postinstall here.
  esbuild: false
  sharp: true
  unrs-resolver: true

# apps/mobile (react-native@0.74.5) pulls jest-environment-node/jest-mock@29.7.0
# as transitive deps of its own internal test helpers, which we don't use. Left
# unpinned, pnpm hoists both 29.x and 30.x copies into the workspace and Jest's
# module-mocker construction picks up the mismatched 29.x build, breaking
# `pnpm test` repo-wide with "clearMocksOnScope is not a function". Pin to the
# 30.x line every other package already uses.
overrides:
  jest-environment-node: "30.4.1"
  jest-mock: "30.4.1"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  # 2026-08-12 security audit: both arrive transitively (sharp bundled by
  # next's image optimisation, fast-uri via ajv -> schema-utils -> webpack's
  # Sentry build tooling) below their patched versions. sharp<0.35.0 inherits
  # libvips CVE-2026-33327/33328/35590/35591 (image-parsing DoS/memory
  # issues); fast-uri<3.1.5 has a host-confusion bug via a backslash authority
  # delimiter. Neither has a direct entry in any package.json to bump instead.
  sharp: ">=0.35.0"
  fast-uri: ">=3.1.5"
  # 2026-08-29 security audit (pnpm audit --prod: 24 findings, 17 high/7
  # moderate, 0 critical). Each entry fixes one or more real advisories;
  # see docs/CLAUDE_SPRINT_HISTORY_ARCHIVE.md-adjacent PR for the full
  # before/after audit output. postcss stays in the same situation as sharp
  # above: next.js/@sentry/nextjs both hard-pin an exact "8.4.31" (not a
  # range) internally, so this override forces past next's own pin the same
  # way the sharp override already does — verified via a full `next build`.
  postcss: ">=8.5.23" # GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q, GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849 (CSS-stringify XSS + arbitrary .map/file read via sourceMappingURL)
  # langsmith arrives transitively via @langchain/core (apps/web's real AI
  # workflow stack — LangGraph.js/Claude API — not build tooling).
  # @langchain/core@0.3.80 (the latest 0.3.x; langchain never shipped a
  # 0.4-0.9 line, only jumped straight to a 1.x major that would need its
  # own migration pass, out of scope here) only ever declared langsmith
  # "^0.3.67". Pinned to the exact minimum patched version, not an open
  # floor, because langsmith ships a breaking major between nearly every one
  # of these advisories and we want a version we've actually verified
  # (full build + jest), not whatever is newest on a given day.
  langsmith: "0.6.0" # GHSA-v34v-rq6j-cj6p, GHSA-fw9q-39r9-c252, GHSA-rr7j-v2q5-chgv, GHSA-3644-q5cj-c5c7
  # uuid: pinned exact for the same reason as langsmith (frequent majors).
  # The handful of exports every consumer here actually uses (v1/v4,
  # parse/stringify/validate) have been stable across all of these majors.
  uuid: "11.1.1" # GHSA-w5hq-g745-h8pq (missing buffer bounds check in v3/v5/v6 when a buffer is provided)
  # nanoid: patch-level bump, stays inside the 3.x line postcss itself
  # requires (^3.3.7) — nanoid 4+ dropped CJS for ESM-only exports, which
  # would break postcss's plain `require('nanoid')`, so this must NOT be an
  # open floor.
  nanoid: "3.3.18" # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8 (non-secure/custom generators loop indefinitely on negative or zero size)
  # js-yaml: two apps/mobile build-tool consumers each pin a different major
  # (cosmiconfig wants ^3.13.1, @expo/xcpretty wants ^4.1.0) — scoped
  # per-range so each stays on the major it was actually shipped against,
  # patched at the point release the advisory calls out.
  "js-yaml@^3.13.1": "3.15.1" # GHSA-5p4m-2wfm-xmqj (quadratic CPU via !!omap resolution)
  "js-yaml@^4.1.0": "4.3.1" # GHSA-5p4m-2wfm-xmqj (quadratic CPU via !!omap resolution)
  # brace-expansion: four different minimatch majors in apps/mobile's build
  # tooling (metro/@expo/cli/react-native codegen/eas-cli) each pin their own
  # brace-expansion major — selector after the @ is minimatch's own declared
  # range for it. Scoped per-range for the same reason as js-yaml above.
  "brace-expansion@^1.1.7": "1.1.18" # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  "brace-expansion@^2.0.1": "2.1.4" # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  "brace-expansion@^2.0.2": "2.1.4" # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  "brace-expansion@^5.0.5": "5.0.9" # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  # fast-xml-parser: only patched at >=5.7.0, a real major bump past
  # @react-native-community/cli-platform-apple/android's own tested
  # "^4.0.12" (no 4.x backport exists). Reachability is low — this only runs
  # inside the RN community CLI's native "doctor"/native-build commands,
  # which this project doesn't use day to day (EAS managed builds, not local
  # `react-native run-ios/android`) — but flagging the major-bump risk since
  # it can't be exercised without a real native build, which is out of scope
  # for this pass (see PR notes).
  "fast-xml-parser@^4.0.12": "5.7.0" # GHSA-gh4j-gqv2-49f6 (XMLBuilder comment/CDATA injection via unescaped delimiters)
  # image-size (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq — ICNS/JXL/HEIF
  # parser infinite loops, via apps/mobile's metro bundler) deliberately has
  # NO override: the advisories claim a fix at ">=2.0.3", but 2.0.3 does not
  # exist on the npm registry or in the image-size GitHub repo's tags as of
  # 2026-08-29 — 2.0.2 (already vulnerable per the advisory's own "<=2.0.2"
  # range) is the latest real release. Forcing a version that doesn't exist
  # would just fail to resolve. Re-check when a real 2.0.3 (or later) ships.
  # 2026-08-30 GitHub Dependabot sweep (19 alerts total; 8 of the 19 are in
  # reference/tarragon-control/ — a deliberately preserved, non-running
  # backup of the abandoned v3 repo per CLAUDE.md, not touched here). The
  # remaining 11 are all in this workspace's own pnpm-lock.yaml, resolved:
  # eas-cli@22.6.0 (a devDependency of @tarragon/mobile, used only for local
  # `eas build`/`eas update` — never reachable from the production web/API
  # runtime) pins four of these EXACTLY (not a range), which is why each key
  # below is scoped to that literal specifier rather than left unscoped —
  # forcing an open floor would also drag up the OTHER, already-safe
  # resolution of the same package used by unrelated tooling (ajv@6.15.0 via
  # eslint's config-array chain in particular, a real major-version
  # difference from the 8.x line eas-cli wants).
  # CVE identifiers below are exactly what GitHub's Dependabot alerts API
  # returned for each advisory (queried directly, not recalled) — no GHSA
  # identifier was looked up or is quoted here.
  "tar@7.5.19": "7.5.21" # CVE-2026-73566 (uncontrolled recursion in mapHas/filesFilter -> stack-overflow DoS via a crafted long-path tar entry)
  "ajv@8.11.0": "8.18.0" # CVE-2025-69873 (ReDoS when using the $data option)
  "diff@7.0.0": "9.0.0" # CVE-2026-24001 (DoS in parsePatch/applyPatch on a crafted patch string) — eas-cli's own diff@4.0.4 (via ts-node, below the vulnerable ">=6.0.0" floor) is untouched. Pinned exact, not an open floor: an initial ">=8.0.3" silently resolved to 9.0.0 on install, and per this file's own langsmith/uuid precedent we want a version actually verified, not whatever pnpm picks on a given day.
  "ts-deepmerge@6.2.0": "8.0.0" # CVE-2026-12644 (prototype-method override leads to DoS)
  # minimatch: two of its four resolved copies are already >=5.1.8
  # (unaffected); eas-cli pins an exact "5.1.2", filelist (an eas-cli
  # transitive dep) declares "^5.0.1" — both scoped separately rather than
  # bumping the two already-clean resolutions or the unrelated minimatch@3.x
  # copy glob@6/7 still use.
  "minimatch@5.1.2": "5.1.8" # CVE-2026-27903, CVE-2026-27904, CVE-2026-26996 (ReDoS via combinatorial/nested-extglob/repeated-wildcard backtracking)
  "minimatch@^5.0.1": "5.1.8" # CVE-2026-27903, CVE-2026-27904, CVE-2026-26996
  # joi and yaml: only one resolved copy of each is actually vulnerable, and
  # the other already sits above the patched floor within the SAME major —
  # unlike the packages above, an unscoped bump here can't drag anything
  # onto an incompatible major, so no per-range scoping needed.
  joi: ">=17.13.4" # CVE-2026-48038 (uncaught RangeError on deeply nested input via recursive link() schemas)
  yaml: ">=2.8.3" # CVE-2026-33532 (stack overflow via deeply nested YAML collections)
