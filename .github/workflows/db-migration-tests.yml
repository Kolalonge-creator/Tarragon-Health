name: DB Migration Tests

# Replays every migration under supabase/migrations/ from scratch against a
# fresh local Postgres (the same check `supabase db reset` gives a developer
# with Docker running locally), then runs packages/db/tests/ against the
# result. Neither of those had ever run in CI before this — a migration
# could reach main with a syntax error, a broken assertion, or a real
# regression in an existing test and nothing would catch it before someone
# hit it on a live `db reset` or, worse, on the production project itself.
#
# Runs on GitHub's own Docker-enabled runners rather than Supabase branching
# (branching needs a paid plan this project isn't on) — functionally the
# same check, just on free infrastructure instead.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "packages/db/tests/**"
      - "scripts/run-db-tests.sh"
      - ".github/workflows/db-migration-tests.yml"
  push:
    # Every branch on purpose, not just main/main-dev: the whole point is to
    # catch a bad migration on a feature branch before it merges, not after.
    paths:
      - "supabase/migrations/**"
      - "packages/db/tests/**"
      - "scripts/run-db-tests.sh"
      - ".github/workflows/db-migration-tests.yml"

concurrency:
  group: db-migration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Replay migrations + run packages/db/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset the local database (replays every migration from scratch)
        run: supabase db reset

      - name: Resolve local DATABASE_URL
        id: db
        run: |
          url=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Run packages/db/tests
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: bash scripts/run-db-tests.sh
