# S39: secret scanning in CI (spec section 13: "Dependency and secret scanning in CI"). Dependency scanning is Dependabot plus CodeQL;
# GitHub secret scanning with push protection is on. This adds a full-history scan with gitleaks so a committed key fails the build.
# Not in the required checks list on purpose: a false positive must not block a hotfix; a real hit is rotated and then allow-listed by
# commit in .gitleaks.toml.
name: Secret scan
on:
  pull_request:
  push:
    branches: [main-dev, main]
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The checksum file comes from the same release, so it cannot catch a replaced release. The expected hash is also
          # pinned here (security audit 2026-11-05, M-10); change it together with GITLEAKS_VERSION.
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
