name: Mobile Maestro (Android emulator)

# Runs the Maestro flows in apps/mobile/.maestro/flows on an Android emulator against a test build you point it at.
# STATUS: written, NOT yet run. It is manual only (workflow_dispatch), is not a required check, and cannot block a merge.
# Why manual: apps/mobile/android is not committed, so there is no APK to build in CI. Build one with EAS
# (eas build --profile preview --platform android), then pass its download URL here. Use a test backend and a test account (is_test = true);
# never point this at production data.
# Network profile: the emulator is set to a slow, lossy link (gsm speed, gprs delay) for the throttled flow, which refuses to run unless told
# the link is throttled (THROTTLE_CONFIRMED=yes), so an unthrottled run cannot report a pass.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "HTTPS URL of an Android test build (.apk)"
        required: true
        type: string
      flow:
        description: "Flow file under apps/mobile/.maestro/flows (for example throttled-2g-sync.yaml), or 'all'"
        required: true
        default: "throttled-2g-sync.yaml"
        type: string

permissions:
  contents: read

jobs:
  maestro-android:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch the build
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          case "$APK_URL" in https://*) ;; *) echo "apk_url must be https"; exit 1;; esac
          curl -fsSL "$APK_URL" -o "$RUNNER_TEMP/app.apk"
      # Pinned release and hash instead of piping an install script into bash (security audit 2026-11-05, M-10): a later step
      # runs this binary with the E2E test account. Change MAESTRO_VERSION and MAESTRO_SHA256 together.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-unpacked"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-unpacked/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MOBILE_E2E_EMAIL: ${{ secrets.MOBILE_E2E_EMAIL }}
          MOBILE_E2E_PASSWORD: ${{ secrets.MOBILE_E2E_PASSWORD }}
          FLOW: ${{ inputs.flow }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash apps/mobile/.maestro/run-android-ci.sh "$RUNNER_TEMP/app.apk"
      - name: Keep the Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-report
          path: ~/.maestro/tests
          if-no-files-found: ignore
