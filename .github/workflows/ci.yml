name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (web + shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Dedicated, individually-nameable mobile gate. Strictly speaking apps/mobile is
  # already typechecked/linted on every PR: the "TypeScript (web + shared)" job's
  # unfiltered `pnpm typecheck` / `pnpm lint` run through turbo, whose task graph
  # includes @tarragon/mobile#typecheck and #lint (verified with
  # `turbo run typecheck --dry=json`) — that job's name is just stale. This job
  # exists so a mobile TS/lint failure is attributed to a check named for it, and
  # so the founder can require it on main-dev independently once it has proven
  # stable — which matters because mobile-ota-publish.yml auto-publishes JS-only
  # main-dev merges to the preview EAS channel with no mobile-named gate in front
  # of it. Deliberately a single job with step-level skips (not a separate
  # paths-filtered workflow): a workflow that never triggers leaves a required
  # check stuck at "expected", while skipped steps still report a green job, so
  # this stays safe to add to required_status_checks later.
  mobile-typescript:
    name: TypeScript (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What can affect mobile TS: the app itself, the one workspace package it
      # imports (@tarragon/shared resolves straight from src/, no build step),
      # and the workspace/CI plumbing that changes how everything resolves.
      - name: Detect mobile-relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - "apps/mobile/**"
              - "packages/shared/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"

      - name: Install pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: pnpm --filter @tarragon/mobile typecheck

      - name: Lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: pnpm --filter @tarragon/mobile lint

      # Structural check only — confirms every Maestro flow file parses as
      # Maestro's own config+commands two-document YAML format (the same
      # check used to validate apps/mobile/.maestro/flows/login-to-overview.yaml
      # by hand before it could ever be run against a real device — see
      # apps/mobile/.maestro/README.md). Catches a broken/malformed flow file
      # before merge; does NOT run any flow against a simulator/device — that
      # needs a macOS runner + a real native build and is out of scope here.
      - name: Lint Maestro flow YAML
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import glob, sys, yaml
          files = glob.glob('apps/mobile/.maestro/flows/*.yaml')
          if not files:
              sys.exit('no Maestro flow files found under apps/mobile/.maestro/flows/')
          for path in files:
              docs = list(yaml.safe_load_all(open(path)))
              assert len(docs) == 2, f'{path}: expected 2 YAML documents (config + commands), got {len(docs)}'
              assert isinstance(docs[0], dict) and 'appId' in docs[0], f'{path}: config block missing appId'
              assert isinstance(docs[1], list) and len(docs[1]) > 0, f'{path}: commands block must be a non-empty list'
              print(f'{path}: OK ({len(docs[1])} commands)')
          "

  python-ml:
    name: Python ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Audit dependencies (pip-audit)
        run: |
          uv pip install pip-audit
          uv run pip-audit
        # `uv pip install` puts pip-audit into the same uv-managed venv `uv sync`
        # just built (without touching pyproject.toml/uv.lock — this is CI-only
        # tooling, not a project dependency), so `uv run pip-audit` then audits
        # this project's *actual* installed dependencies (fastapi, pydantic,
        # scipy, sentry-sdk, uvicorn, ...) rather than an empty/unrelated
        # environment. Confirmed live 2026-08-29 (0 known vulnerabilities in the
        # current dependency set — see PR description). pip-audit has no
        # built-in severity threshold to filter on (checked `pip-audit --help`);
        # its default behavior is to fail (non-zero exit) on any known
        # vulnerability at all, which is deliberately left as-is here rather
        # than suppressed or narrowed.

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  # Real-browser E2E (Playwright), distinct from the Jest `e2e/` suite (which
  # hits the live project's DB/Edge Functions directly, bypassing the UI).
  # Runs against a fresh LOCAL Supabase stack, never the live production
  # project — branching isn't available on the current plan
  # (PaymentRequiredException, checked live 2026-09-23), so this reuses the
  # same free, Docker-based tooling supabase-db below already proves works
  # (`supabase start` + `db reset`) rather than touching production on every
  # PR. See apps/web/e2e-browser/README.md for the full reasoning and what's
  # covered. NOTE: this job could not be executed even once in the session
  # that wrote it (no Docker in that sandbox) — its first real run is
  # whatever CI run first picks up this commit. Read a failure here as
  # genuine signal, not flakiness, until it's proven green at least once.
  e2e-browser:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    # supabase-db below (migration replay + DB proofs only) budgets 15
    # minutes; this job does that SAME supabase start + db reset, plus
    # pnpm install, a cold `playwright install --with-deps chromium`
    # (routinely 2-5 min on a fresh runner), Next's own dev-server boot, and
    # 7 real-browser tests — 20 minutes had no empirical basis (this job
    # could not be run even once before being written, see the header
    # comment below) and was reviewed as likely too tight. 30 minutes gives
    # real headroom; tighten once this job has actually run and its real
    # duration is known.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect E2E-relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - "apps/web/**"
              - "packages/shared/**"
              - "supabase/migrations/**"
              - "supabase/seed.sql"
              - ".github/workflows/ci.yml"

      - name: Install pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        with:
          version: latest

      - name: Start local Supabase stack
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        run: supabase start

      - name: Replay all migrations + seed
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        run: supabase db reset

      # `-o env` prints NAME=value lines for the local stack's own connection
      # details; --override-name renames them directly to what Next.js
      # expects, so no separate remap step is needed. Documented as a real
      # CLI example (`supabase status --help`), but NOT verified live in the
      # session that wrote this job (no Docker there) — if the override keys
      # below don't match (e.g. api.anon_key vs a different path), this step
      # is the first place to look on a failed run.
      # First live run of this job (2026-09-22) failed here: next dev's
      # proxy.ts (Edge Runtime, always) threw "Invalid supabaseUrl" even
      # though NEXT_PUBLIC_SUPABASE_URL/ANON_KEY WERE present in this job's
      # own shell env by the time Playwright spawned `pnpm dev` — confirmed
      # directly in that run's own `env:` debug printout for the next step.
      # Next.js/Turbopack's own env-var pickup for Edge Runtime code is not
      # guaranteed to reliably inherit ambient process.env the way a plain
      # Node process does; writing a real apps/web/.env.local is the one
      # mechanism Next's dev server is documented to read directly at
      # startup, collapsing the previous fragile chain (GH step env ->
      # $GITHUB_ENV -> shell -> playwright.config.ts -> spawned child
      # process -> Turbopack) into a single, Next-native source of truth.
      # $GITHUB_ENV is still populated too, for the Playwright test process
      # itself and its Node-based Supabase admin client
      # (helpers/supabase-admin.ts), which read process.env directly with
      # no Turbopack/Edge Runtime involved.
      - name: Export local Supabase connection env vars
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        run: |
          # ROOT CAUSE (found 2026-09-23 after 5 failed attempts — see git
          # history for the full chase): `supabase status -o env`'s raw
          # output quotes its values (`KEY="value"`). $GITHUB_ENV is NOT a
          # shell — appending that raw content to it via a bare `cat >>`
          # does not strip the quotes; GitHub Actions takes everything
          # after the first `=` as the LITERAL value, quote characters
          # included. Every subsequent step's process.env.NEXT_PUBLIC_SUPABASE_URL
          # was therefore the 27-character string `"http://127.0.0.1:54321"`
          # (quote marks genuinely part of the value, confirmed via a
          # JSON.stringify diagnostic directly in next.config.ts's own
          # module scope), not the 21-character URL — which is exactly why
          # `new URL(...)` / @supabase/ssr's own validator threw "Invalid
          # supabaseUrl" no matter which OTHER mechanism (.env.local,
          # next.config.ts's `env` field, forcing NODE_ENV, switching
          # bundlers) was used to try to supply it: process.env is Next's
          # highest-priority env source, so the quote-contaminated value
          # from $GITHUB_ENV kept winning over every correctly-clean
          # alternative.
          #
          # Fix: `source` the raw output as shell script FIRST (bash's own
          # parser correctly strips the quotes) and only then write clean,
          # unquoted KEY=value lines to both $GITHUB_ENV and
          # apps/web/.env.local — never `cat`/`cp` the CLI's raw output
          # directly into either.
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > /tmp/supabase-env.txt
          set -a
          source /tmp/supabase-env.txt
          set +a
          : > apps/web/.env.local
          for f in "$GITHUB_ENV" apps/web/.env.local; do
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" >> "$f"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" >> "$f"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> "$f"
          done

      - name: Run browser E2E tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true'
        working-directory: apps/web
        env:
          # sk_test_... only, from repo secrets — see e2e-browser/README.md
          # and b2c-signup-to-entitlement.spec.ts's own comment: the
          # checkout-initiation test skips gracefully if this isn't set,
          # rather than failing the whole job. NOT yet configured as of
          # 2026-09-23 (checked via `gh secret list`) — add
          # PAYSTACK_SECRET_KEY as a repo secret to turn that test on.
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: pnpm test:e2e-browser

      - name: Upload Playwright report
        if: always() && (github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Stop local Supabase stack
        if: always() && (github.event_name != 'pull_request' || steps.changes.outputs.e2e == 'true')
        run: supabase stop

  # Edge functions (supabase/functions/) are Deno, not Node — they're outside
  # every other job's reach (pnpm/jest never sees them; supabase-db below
  # replays migrations, not function code). Until this job, paystack-webhook
  # — the authoritative source of truth for subscription/service activation,
  # see that file's own header — had zero direct test coverage; the only
  # existing check was a drift guard comparing text, not behaviour
  # (apps/web/src/lib/billing/refund-idempotency.test.ts). Path-filtered like
  # mobile-typescript above, for the same reason: cheap to skip when nothing
  # under supabase/functions changed.
  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect edge-function changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            edge:
              - "supabase/functions/**"
              - ".github/workflows/ci.yml"

      - name: Set up Deno
        if: github.event_name != 'pull_request' || steps.changes.outputs.edge == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --no-config: Deno auto-detects the repo root's pnpm-workspace.yaml and
      # tries to migrate it into package.json's own "workspaces" field as a
      # side effect of running at all inside this directory (reproduced
      # locally 2026-09-23) — irrelevant to and unwanted by these tests, which
      # need none of Deno's npm-compat machinery. --allow-env is scoped to
      # exactly what index.test.ts uses today; extend this list (never widen
      # to a bare --allow-env) when a future edge-function test needs another
      # variable.
      #
      # Scoped to paystack-webhook/, not the whole supabase/functions tree:
      # the other 5 functions (abnormal-result-handler, integration-outbound-
      # drain, send-pending-notifications, send-support-reply, whatsapp-
      # webhook, zoom-webhook) have never been `deno lint`ed either and carry
      # 6 pre-existing require-await findings unrelated to this change
      # (checked 2026-09-23) — widen this glob directory-by-directory once
      # each is verified clean, rather than landing a job that's red on day
      # one for code this change never touched.
      - name: Test
        if: github.event_name != 'pull_request' || steps.changes.outputs.edge == 'true'
        working-directory: supabase/functions/paystack-webhook
        run: deno test --no-config --allow-env=PAYSTACK_WEBHOOK_SECRET,TERMII_API_KEY,APP_BASE_URL .

      - name: Lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.edge == 'true'
        working-directory: supabase/functions/paystack-webhook
        run: deno lint --no-config .

  supabase-db:
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Replay all migrations + seed
        run: supabase db reset

      # The SQL proof scripts in packages/db/tests were referenced by no
      # workflow at all until 2026-09-05: several thousand lines of RLS and
      # ledger verification, complete with sabotage checks, that looked like a
      # gate and ran only by hand. This runs the ones that hold on a freshly
      # reset stack (packages/db/tests/ci.manifest) and fails the job on a
      # raised assertion or a FAIL verdict. It also fails if a new proof file
      # is in neither ci.manifest nor ci.excluded, so the next one cannot
      # quietly join the pile that never runs.
      - name: Run database proof scripts
        run: ./scripts/run-db-proofs.sh
