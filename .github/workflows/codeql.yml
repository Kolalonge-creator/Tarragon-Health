name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches vulnerable patterns introduced by a dependency/config change
    # alone, with no app-code PR to trigger a scan.
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers both apps/web and apps/mobile;
        # python covers the standalone services/ml microservice.
        language: ["javascript-typescript", "python"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
