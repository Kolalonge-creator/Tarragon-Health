name: Community overdue-work check

# Every ten minutes, round the clock: tell the safety reviewers, moderators and the Chief Medical Officer when a Community safety item or
# queue item has waited too long. Needs two repository secrets: COMMUNITY_CRON_URL (for example https://app.tarragonhealth.ng) and
# CRON_SECRET (the same value as the app's CRON_SECRET). With either missing the job exits quietly, so it is safe to leave in place.
# GitHub may delay scheduled runs by a few minutes under load; the thresholds in the configuration allow for that.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the overdue-work route
        env:
          COMMUNITY_CRON_URL: ${{ secrets.COMMUNITY_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COMMUNITY_CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "COMMUNITY_CRON_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${COMMUNITY_CRON_URL%/}/api/cron/community-overdue"
