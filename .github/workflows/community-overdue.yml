name: Community overdue-work check

# Every ten minutes, round the clock: tell the safety reviewers, moderators and the Chief Medical Officer when a Community safety item or
# queue item has waited too long. Needs two repository secrets: COMMUNITY_CRON_URL (for example https://app.tarragonhealth.ng) and
# CRON_SECRET (the same value as the app's CRON_SECRET). With either missing the job does nothing but says so loudly (a warning on the run and
# in its summary), and Community cannot be switched on until the check has been seen running (go-live condition overdue_monitor_running).
# GitHub may delay scheduled runs by a few minutes under load; the thresholds in the configuration allow for that.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the overdue-work route
        env:
          COMMUNITY_CRON_URL: ${{ secrets.COMMUNITY_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COMMUNITY_CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning title=Community overdue check is not set up::COMMUNITY_CRON_URL or CRON_SECRET is missing, so nothing was checked. Add both repository secrets (see docs/community/OPERATIONS_SETUP.md)."
            {
              echo "### Community overdue check did not run"
              echo "The repository secret COMMUNITY_CRON_URL or CRON_SECRET is missing. Add both; see docs/community/OPERATIONS_SETUP.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$COMMUNITY_CRON_URL" in
            https://*) ;;
            *) echo "::error title=COMMUNITY_CRON_URL must start with https://::The secret is not sent over an unencrypted connection."; exit 1 ;;
          esac
          # A short retry covers a deploy in progress or a brief network blip. The secret goes in a header only, never in the address or the log.
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${COMMUNITY_CRON_URL%/}/api/cron/community-overdue"
