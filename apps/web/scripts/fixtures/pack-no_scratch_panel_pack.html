<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  .pack { width: 480px; height: 320px; padding: 24px; box-sizing: border-box; border: 3px solid #1a5c38; position: relative; }
  .brand { font-size: 28px; font-weight: bold; color: #1a5c38; }
  .generic { font-size: 16px; color: #333; margin-top: 2px; }
  .strength { font-size: 20px; font-weight: bold; margin-top: 10px; }
  .form { font-size: 15px; color: #444; }
  .manu { font-size: 13px; color: #555; margin-top: 18px; }
  .nafdac { font-size: 13px; color: #000; margin-top: 6px; font-weight: bold; }
  .expiry { font-size: 13px; color: #000; margin-top: 6px; }
  .scratch { position: absolute; bottom: 20px; right: 20px; width: 90px; height: 40px; background: repeating-linear-gradient(45deg, #999, #999 4px, #bbb 4px, #bbb 8px); border: 1px solid #666; font-size: 10px; color: #333; display: flex; align-items: center; justify-content: center; text-align: center; }
</style></head>
<body><div class="pack" id="no_scratch_panel_pack">
  <div class="brand">Amoxil</div>
  <div class="generic">Amoxicillin Capsules BP</div>
  <div class="strength">500mg</div>
  <div class="form">21 Capsules</div>
  <div class="manu">Manufactured by: GlaxoSmithKline Nigeria Plc</div>
  <div class="nafdac">NAFDAC Reg. No: 04-5678</div>
  <div class="expiry">EXP: 11/2027 | BATCH: G9981</div>
</div>

</body></html>
