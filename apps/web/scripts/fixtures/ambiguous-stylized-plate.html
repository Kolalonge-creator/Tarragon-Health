<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #fff; display: flex; align-items: center; justify-content: center; height: 300px; }
  .plate { width: 260px; height: 260px; border-radius: 50%; background: #f5f5f5; border: 6px solid #ddd; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .rice { position: absolute; left: 30px; top: 40px; width: 130px; height: 100px; border-radius: 50% 50% 40% 40%; background: #f2d675; }
  .stew { position: absolute; left: 40px; top: 50px; width: 110px; height: 80px; border-radius: 50%; background: #c0392b; opacity: 0.5; }
  .protein { position: absolute; right: 30px; top: 60px; width: 70px; height: 50px; border-radius: 40%; background: #8b5a2b; }
  .side { position: absolute; right: 40px; bottom: 40px; width: 60px; height: 30px; border-radius: 30%; background: #e2b04a; }
</style></head>
<body>
<div class="plate">
  <div class="rice"></div>
  <div class="stew"></div>
  <div class="protein"></div>
  <div class="side"></div>
</div>
</body></html>
