<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #222; }
  .laptop { width: 400px; height: 260px; margin: 40px auto; background: #444; border-radius: 8px; position: relative; }
  .screen { position: absolute; top: 20px; left: 30px; right: 30px; bottom: 60px; background: #1a73e8; border-radius: 4px; }
  .keyboard { position: absolute; bottom: 10px; left: 40px; right: 40px; height: 30px; background: #555; border-radius: 4px; }
</style></head>
<body>
<div class="laptop">
  <div class="screen"></div>
  <div class="keyboard"></div>
</div>
</body></html>
