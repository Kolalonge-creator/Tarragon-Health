# freshclam for the Tarragon upload scanner.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
Foreground yes
LogTime yes
# Check for new signatures 12 times a day (every 2 hours). ClamAV's mirror asks clients not to check more than hourly.
Checks 12
# Tell clamd to reload after a successful update.
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 30
ReceiveTimeout 60
