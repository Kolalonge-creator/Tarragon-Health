# clamd for the Tarragon upload scanner. Loopback only: the only client is the FastAPI process in the same container.
Foreground yes
LogTime yes
LogVerbose no
# No LogFile: with Foreground, clamd logs to stdout/stderr, which Railway collects.
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
# Uploads are capped at 10 MB by the platform and by the scanner itself; a little headroom for the INSTREAM framing.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 50M
MaxThreads 4
# Reload the signature database in place after freshclam updates it. Non-concurrent reload pauses scanning for a few seconds but
# does not need a second copy of the database in memory (keeps the container inside ~1.5 GB).
ConcurrentDatabaseReload no
SelfCheck 3600
# Password-protected PDFs are common for real lab reports and are not flagged on that alone; Office macros and broken
# executables are.
AlertEncryptedArchive no
AlertEncryptedDoc no
AlertOLE2Macros yes
AlertBrokenExecutables yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes
